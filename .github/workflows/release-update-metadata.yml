name: 同步正式版更新信息

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-update-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 查询当前最新正式版，避免旧版编辑事件覆盖新版元数据。
            const repo = context.repo;
            let tag = "";
            try {
              const { data } = await github.rest.repos.getLatestRelease(repo);
              tag = data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const path = "updates/latest.json";
            const branch = context.payload.repository.default_branch;
            const value = JSON.stringify({ tag_name: tag, draft: false, prerelease: false }, null, 2) + "\n";
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ ...repo, path, ref: branch });
              if (Buffer.from(data.content, "base64").toString("utf8") === value) return;
              sha = data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...repo, path, branch, sha,
              message: `同步最新正式版更新信息：${tag || "暂无正式版"}`,
              content: Buffer.from(value).toString("base64"),
            });
